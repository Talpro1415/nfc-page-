
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NFC Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f9f9f9;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      margin-right: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Enter Password to Continue</h2>
  <div>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
  </div>
  <p id="status"></p>

  <script>
    function checkPassword() {
      const correctPassword = "2242011";
      const input = document.getElementById("pass").value;

      if (input === correctPassword) {
        document.getElementById("status").innerText = "Access granted!";

        // Trigger Join webhook
        fetch("https://joinjoaomgcd.appspot.com/_ah/api/messaging/v1/sendPush?apikey=a0dff7af1cca4bd286ed9d3f0ec2466a&text=unlockpc%3D5544&deviceId=bdfba64ca50540d4ab852e7bac9fd84b")
          .then(() => {
            document.getElementById("status").innerText = "Triggered successfully!";
          })
          .catch(err => {
            document.getElementById("status").innerText = "Error sending webhook.";
          });

      } else {
        document.getElementById("status").innerText = "Wrong password.";
      }
    }
  </script>
</body>
</html>
